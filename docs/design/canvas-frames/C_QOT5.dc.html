<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Table Show More Charcoal</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@400;500;600;700;800&amp;family=Geist+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
button{font-family:inherit;cursor:pointer}
a{color:inherit;text-decoration:none}
*{scrollbar-width:thin;scrollbar-color:#C4C7C5 transparent}
*::-webkit-scrollbar{height:8px;width:8px}
*::-webkit-scrollbar-track{background:transparent}
*::-webkit-scrollbar-thumb{background:#C4C7C5;border-radius:8px}
</style>
</helmet>
<div style="position: relative; height: 900px; overflow: hidden; display: flex; flex-wrap: nowrap; align-items: stretch; font-family: 'Albert Sans', sans-serif; background: #E9EBEA; color: #1B1F1D; font-size: 14.5px">
  <aside style="flex: 0 0 216px; align-self: stretch; background: #1F2422">
    <div style="position: sticky; top: 0; height: 900px; box-sizing: border-box; padding: 20px 14px; display: flex; flex-direction: column; gap: 3px">
      <div style="display: flex; align-items: center; gap: 10px; padding: 0 8px">
        <svg width="40" height="40" viewBox="10 10 80 80" fill="none" stroke="#FFFFFF" stroke-width="7.5" stroke-linecap="round" role="img" aria-label="Querent"><circle cx="49" cy="49" r="28.5"></circle><path d="M60 60 81 82"></path></svg>
        <span style="font-weight: 800; font-size: 20px; letter-spacing: -0.03em; color: #fff">Querent</span>
      </div>
      <div style="padding: 6px 8px 22px; font-size: 13px; font-weight: 800; white-space: nowrap; color: #E6E8E7">Herrick Industrial Supply</div>
      <sc-for list="{{nav}}" as="n" hint-placeholder-count="7">
        <a href="#" style="display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 10px; background: {{n.bg}}; color: {{n.fg}}; font-weight: {{n.w}}">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{n.d}}"></path></svg>
          <span style="font-size: 14px; white-space: nowrap">{{n.label}}</span>
        </a>
      </sc-for>
      <div style="flex: 1 1 auto"></div>
      <div style="border-top: 1px solid #343A37; padding: 14px 8px 0; display: flex; flex-direction: column; gap: 12px">
        <div style="display: flex; align-items: center; gap: 10px">
          <div style="width: 38px; height: 38px; border-radius: 50%; background: #fff; color: #1F2422; font-size: 13px; font-weight: 800; display: flex; align-items: center; justify-content: center">BG</div>
          <div><div style="font-weight: 700; color: #fff">Brian G.</div><div style="font-size: 12.5px; color: #A9AEAB">Manager</div></div>
        </div>
        <button style="height: 36px; border-radius: 9px; border: 1px solid #4A514D; background: transparent; color: #fff; font-weight: 600">Sign out</button>
      </div>
    </div>
  </aside>

  <main style="flex: 1 1 auto; min-width: 0; box-sizing: border-box; padding: 24px 32px 40px; transform: translateY(-1000px)">
    <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px">
      <h1 style="margin: 0; font-size: 32px; font-weight: 800; letter-spacing: -0.035em">Quotes</h1>
      <div style="width: 320px; max-width: 100%; box-sizing: border-box; height: 42px; border-radius: 10px; background: #fff; border: 1px solid #D6D9D7; display: flex; align-items: center; gap: 10px; padding: 0 14px">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#585F5B" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6"></circle><path d="m20 20-4-4"></path></svg>
        <span style="font-weight: 600">All customers</span>
      </div>
      <button style="height: 40px; padding: 0 14px; border: 1px solid #D6D9D7; background: #fff; border-radius: 10px; font-weight: 600; display: flex; align-items: center; gap: 8px">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M3 5h18l-7 8v6l-4-2v-4L3 5z"></path></svg>Filter</button>
      <div style="display: flex; background: #fff; border: 1px solid #D6D9D7; border-radius: 10px; padding: 3px">
        <button style="height: 32px; padding: 0 14px; border: 0; border-radius: 7px; background: transparent; color: #585F5B; font-weight: 600">Board</button>
        <button style="height: 32px; padding: 0 14px; border: 0; border-radius: 7px; background: {{accent}}; color: #fff; font-weight: 700">Table</button>
      </div>
      <div style="display: flex; align-items: center; gap: 10px; margin-left: auto">
        <button aria-label="Needs attention, 2 items" style="width: 40px; height: 40px; border-radius: 10px; border: 1px solid #F1BEB8; background: #FFEDEA; color: #C92A1C; display: flex; align-items: center; justify-content: center">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3 2 20h20L12 3z"></path><path d="M12 10v4M12 17.5v.01"></path></svg>
        </button>
        <button aria-label="Notifications" style="width: 40px; height: 40px; border-radius: 10px; border: 1px solid #D6D9D7; background: #fff; color: #585F5B; display: flex; align-items: center; justify-content: center">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 17v-6a6 6 0 1 1 12 0v6l1.5 2h-15L6 17z"></path><path d="M10 21a2 2 0 0 0 4 0"></path></svg>
        </button>
      </div>
    </div>

    <div style="background: #fff; border: 1px solid #DDDFDE; border-radius: 14px; margin-top: 24px; overflow: hidden">
      <div style="overflow-x: auto">
        <div style="min-width: 880px">
          <div style="display: grid; grid-template-columns: 1fr 2.2fr 0.9fr 1.5fr 1fr 0.9fr 28px; gap: 16px; padding: 10px 20px; font-size: 12.5px; font-weight: 800; color: #3A403D; background: #E8EAE9">
            <div>:: Quote</div><div>:: Customer</div><div>:: Requested</div><div>:: Status</div><div style="text-align: right">:: Total</div><div style="text-align: right">:: Margin</div><div style="display: flex; justify-content: flex-end"><button aria-label="Choose columns" style="width: 28px; height: 24px; padding: 0; border: 0; border-radius: 6px; background: rgba(0,0,0,0.08); color: inherit; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v14H4z M9.5 5v14 M14.5 5v14"></path></svg></button></div>
          </div>
          <sc-for list="{{rows}}" as="r" hint-placeholder-count="12">
            <div style="display: grid; grid-template-columns: 1fr 2.2fr 0.9fr 1.5fr 1fr 0.9fr 28px; gap: 16px; padding: 14px 20px; border-top: 1px solid #ECEEED; align-items: center">
              <div style="font-weight: 800">{{r.id}}</div>
              <div>{{r.cust}}</div>
              <div style="color: #585F5B">{{r.date}}</div>
              <div>
                <div style="font-weight: 600">{{r.st}}</div>
                <sc-if value="{{r.flag}}" hint-placeholder-val="{{ false }}"><div style="margin-top: 3px; font-size: 12.5px; font-weight: 700; color: #C92A1C">{{r.flag}}</div></sc-if>
                <sc-if value="{{r.note}}" hint-placeholder-val="{{ false }}"><button style="margin-top: 6px; height: 26px; padding: 0 10px; border: 0; border-radius: 6px; background: #FBE7A1; color: #5C4300; font-weight: 700; font-size: 12px">View note</button></sc-if>
              </div>
              <div style="text-align: right; font-weight: 800; font-variant-numeric: tabular-nums">{{r.total}}</div>
              <div style="text-align: right; font-family: 'Geist Mono', monospace; font-size: 13px; color: #3A403D">{{r.margin}}</div>
            </div>
          </sc-for>
          <div style="padding: 14px 22px; border-top: 1px solid #ECEEED; text-align: center"><button style="height: 38px; padding: 0 22px; border: 1px dashed #9DA29F; background: transparent; border-radius: 9px; color: #343A37; font-weight: 700">Show fewer quotes</button></div>
        </div>
      </div>
    </div>
  </main>
<div style="position: absolute; top: 16px; right: 24px; z-index: 10; background: #1F2422; color: #fff; font-weight: 700; font-size: 13px; padding: 7px 14px; border-radius: 999px">Scrolled down after Show more</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#14803C"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const W = 'Wasatch Mechanical Contractors', CR = 'Canyon Ridge Builders', BE = 'Bonneville Electric Supply', SP = 'Summit Plumbing and Heating', RR = 'Red Rock Excavation', TC = 'Teton Concrete Works';
    const pool = [W, CR, BE, SP, RR, TC, W];
    const q = (id, date, cust, total, margin, st, flag, note) => ({ id, date, cust, total, margin, st, flag: flag || '', note: note || '' });
    const aT = ['$1,846.20', '$412.90', '$3,205.75', '$788.00', '$154.60', '$2,019.35', '$967.45', '$5,120.00', '$233.10', '$1,402.80', '$689.55', '$2,774.90', '$318.25', '$1,095.40', '$842.70', '$4,391.15', '$571.60'];
    const aM = ['33.1%', '36.0%', '31.4%', '34.8%', '38.2%', '32.7%', '35.5%', '29.9%', '37.1%', '33.6%', '34.2%', '30.8%', '39.4%', '32.3%', '35.9%', '31.1%', '34.4%'];
    const aD = ['Sep 8', 'Sep 5', 'Sep 3', 'Aug 30', 'Aug 28', 'Aug 26', 'Aug 22', 'Aug 20', 'Aug 18', 'Aug 15', 'Aug 13', 'Aug 11', 'Aug 8', 'Aug 6', 'Aug 4', 'Jul 31', 'Jul 29'];
    const A = 'Accepted';
    const acc = [q('Q-24816', 'Sep 23', W, '$655.25', '28.9%', A), q('Q-24763', 'Sep 21', CR, '$2,482.58', '33.9%', A), q('Q-24814', 'Sep 9', W, '$291.15', '34.5%', A)].concat(aT.map((t, i) => q('Q-' + (24813 - i), aD[i], pool[i % 7], t, aM[i], A)));
    const eId = ['Q-24796', 'Q-24795', 'Q-24794', 'Q-24793', 'Q-24792', 'Q-24788'], eT = ['$208.40', '$1,310.00', '$97.85', '$642.30', '$2,055.10', '$430.75'], eM = ['38.0%', '31.9%', '44.1%', '35.2%', '30.4%', '36.6%'], eD = ['Aug 27', 'Aug 21', 'Aug 14', 'Aug 9', 'Aug 2', 'Jul 26'];
    const exp = [q('Q-24815', 'Sep 18', W, '$322.80', '42.8%', 'Expired')].concat(eId.map((id, i) => q(id, eD[i], pool[(i + 2) % 7], eT[i], eM[i], 'Expired')));
    const rows = [q('Q-24791', 'Oct 9', W, '$96.00', '35.4%', 'Sent'), q('Q-24817', 'Oct 9', W, '$1,122.40', '32.2%', 'Draft ready', 'Overdue. 1 line below floor'), q('Q-24790', 'Oct 8', W, '$1,164.00', '34.9%', 'Changes requested', 'Overdue', true), q('Q-24789', 'Oct 6', W, '$360.80', '34.5%', 'Sent', 'Aging')].concat(acc, exp);
    const menu = [['All quotes', 31], ['Draft ready', 1], ['Changes requested', 1], ['Sent', 2], ['Accepted', 20], ['Expired', 7], ['Declined', 0]].map((m, i) => ({ label: m[0], n: m[1], bg: i === 0 ? '#E8EAE9' : 'transparent', w: i === 0 ? 800 : 500 }));
    const items = [['Quotes', 'M6 3h9l4 4v14H6V3z M14 3v5h5 M9 13h7 M9 17h5'], ['Customers', 'M12 4a4 4 0 1 0 0 8 4 4 0 0 0 0-8z M4 21c1-4 4-6 8-6s7 2 8 6'], ['Orders', 'M3 8l9-5 9 5v9l-9 5-9-5V8z M3 8l9 5 9-5 M12 13v9'], ['Stock', 'M4 4h7v7H4z M13 4h7v7h-7z M4 13h7v7H4z M13 13h7v7h-7z'], ['Analytics', 'M4 20V10 M10 20V4 M16 20v-8 M22 20H2'], ['Teams and Reps', 'M9 4.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7z M17 6.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5z M2 20c.8-3.5 3.3-5 7-5s6.2 1.5 7 5 M17 14c3 0 4.7 1.4 5 4'], ['Settings', 'M12 9a3 3 0 1 0 0 6 3 3 0 0 0 0-6z M12 2v3 M12 19v3 M2 12h3 M19 12h3 M5 5l2 2 M17 17l2 2 M19 5l-2 2 M7 17l-2 2']];
    const nav = items.map((n, i) => ({ label: n[0], d: n[1], bg: i === 0 ? '#14803C' : 'transparent', fg: i === 0 ? '#fff' : '#A9AEAB', w: i === 0 ? 700 : 500 }));
    return { accent: this.props.accent ?? '#14803C', rows, menu, nav };
  }
}
</script>
</body>
</html>
